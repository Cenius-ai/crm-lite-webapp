<div class="form-container">
  <h3 class="form-title">{{ company ? 'Edit Company' : 'New Company' }}</h3>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-field">
      <label for="company-name">Name <span class="required">*</span></label>
      <input
        id="company-name"
        type="text"
        formControlName="name"
        placeholder="Company name"
        [class.error]="fieldError('name')"
      />
      @if (fieldError('name')) {
        <span class="field-error">{{ fieldError('name') }}</span>
      }
    </div>

    <div class="form-field">
      <label for="company-industry">Industry</label>
      <input
        id="company-industry"
        type="text"
        formControlName="industry"
        placeholder="e.g. Technology, Manufacturing"
      />
    </div>

    <div class="form-field">
      <label for="company-phone">Phone</label>
      <input
        id="company-phone"
        type="text"
        formControlName="phone"
        placeholder="+1-555-0100"
      />
    </div>

    <div class="form-field">
      <label for="company-website">Website</label>
      <input
        id="company-website"
        type="text"
        formControlName="website"
        placeholder="https://example.com"
      />
    </div>

    <div class="form-field">
      <label for="company-address">Address</label>
      <input
        id="company-address"
        type="text"
        formControlName="address"
        placeholder="Street, City, State ZIP"
      />
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-ghost" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn btn-primary">
        {{ company ? 'Save Changes' : 'Create Company' }}
      </button>
    </div>
  </form>
</div>
